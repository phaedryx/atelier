<!-- Source for dmg-background@2x.png. Regenerate with:
       rsvg-convert -w 1320 -h 1000 Resources/dmg-background.svg -o Resources/dmg-background@2x.png
     The PNG is deliberately taller than 2x this canvas and so renders stretched:
     the extra height keeps the artwork clear of the Finder status bar (#424). -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440">
  <defs>
    <!-- Subtle wine glow between icon positions -->
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#5B2333" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5B2333" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="660" height="440" fill="#F7F4F3"/>

  <!-- Wine glow -->
  <ellipse cx="330" cy="180" rx="240" ry="160" fill="url(#glow)"/>

  <!-- Chevrons between icon positions -->
  <g stroke="#5B2333" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="305,177 315,187 305,197"/>
    <polyline points="325,177 335,187 325,197"/>
    <polyline points="345,177 355,187 345,197"/>
  </g>

  <!-- Drag label -->
  <text x="330" y="230" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#928E8D">Drag to Applications</text>

  <!-- Easel row, scaled to fit. Transcribed from EaselGeometry in
       Sources/Views/EaselRow.swift and kept in step with it by hand: two
       paths, because the app strokes the terminals finer than the frames and
       an SVG path has one stroke-width the same way a SwiftUI Shape has one
       StrokeStyle. Change the geometry there and this has to be redrawn. -->
  <g transform="translate(-5.5, 280) scale(0.556, 0.5)" opacity="0.2">
    <defs>
      <linearGradient id="easelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="10%" stop-color="#5B2333"/>
        <stop offset="90%" stop-color="#5B2333"/>
        <stop offset="100%" stop-color="transparent"/>
      </linearGradient>
    </defs>
