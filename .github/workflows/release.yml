name: Release

# Releases are tag-driven: push a `vX.Y.Z` tag and this builds a DMG for it and
# publishes it on the GitHub release.
#
# Builds are ad-hoc signed only — there is no Developer ID certificate and no
# notarization, because this is a personal project and notarization requires a
# paid Apple Developer account. Ad-hoc signing is not optional: arm64 binaries
# will not execute without at least that. What it costs is Gatekeeper: a
# downloaded DMG is quarantined, so the app has to be opened once through the
# right-click > Open path (or have the quarantine attribute removed). The
# release notes say so; docs/distribution.md has the detail.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      actions: write
    env:
      APP_NAME: "Atelier"
      SCHEME: "Atelier"
      PROJECT: "Atelier.xcodeproj"
    steps:
      - name: Derive version from tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a vX.Y.Z tag, not $GITHUB_REF_NAME"
            exit 1
          fi
          if ! echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Zig
        uses: ./.github/actions/install-zig
        with:
          version: 0.15.2

      - uses: oven-sh/setup-bun@v2

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: |
            build/derived/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
          restore-keys: spm-

      # Keyed on the submodule's checked-out commit, the way ci.yml does it.
      # `hashFiles('ghostty/.git')` stood here and could not work: for a
      # submodule that path is a pointer file whose contents never change when
      # the pinned commit moves, so a stale libghostty would be restored
      # forever. The arch is in the namespace too — an arm64 release must never
      # restore the universal artifact this workflow used to build.
      - name: Compute Ghostty cache key
        id: ghostty-key
        run: echo "key=ghostty-release-$(git -C ghostty rev-parse HEAD)-zig-0.15.2-arm64" >> "$GITHUB_OUTPUT"

      - name: Cache Ghostty xcframework
        id: ghostty-cache
        uses: actions/cache@v5
        with:
          path: |
            ghostty/macos/GhosttyKit.xcframework
            ghostty/zig-out/share
          key: ${{ steps.ghostty-key.outputs.key }}

      - name: Build Ghostty xcframework
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          cd ghostty
          # `native`, not `universal`: the release ships arm64 only, and the
          # macos-15 runner is Apple Silicon. Building both slices cost a cold
          # zig build's worth of time for an x86_64 half nothing installs.
          zig build -Demit-xcframework=true -Demit-macos-app=false -Dxcframework-target=native -Doptimize=ReleaseFast

      # `native` emits a single-slice xcframework, so the slice directory is
      # `macos-arm64` — not the `macos-arm64_x86_64` that `project.yml`'s
      # LIBRARY_SEARCH_PATHS names, which is the universal artifact's name and
      # the one `.shared/` carries for local builds. Resolving the slice here
      # and overriding the search path for this build only keeps project.yml
      # correct for everyone else, and makes flipping the ghostty target a
      # one-line change instead of a link failure.
      #
      # The glob is unambiguous: the iOS slices are `ios-arm64*`, so `macos-*`
      # matches exactly one directory under either target.
      - name: Resolve the Ghostty slice and resources
        id: ghostty-slice
        run: |
          root=ghostty/macos/GhosttyKit.xcframework
          slice=$(ls -d "$root"/macos-* 2>/dev/null | head -1)
          if [ -z "$slice" ]; then
            echo "::error::no macos-* slice in $root"
            ls -la "$root" || true
            exit 1
          fi
          # All three failures surface here, in a second, rather than at three
          # different depths of a ten-minute build: a missing library fails at
          # link, missing resources fail at Copy Bundle Resources.
          fail=0
          test -f "$slice/libghostty.a" || { echo "::error::$slice has no libghostty.a"; ls -la "$slice"; fail=1; }
          test -d ghostty/zig-out/share/terminfo || { echo "::error::no ghostty/zig-out/share/terminfo"; fail=1; }
          test -d ghostty/zig-out/share/ghostty || { echo "::error::no ghostty/zig-out/share/ghostty"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "Slice: $slice"
          lipo -info "$slice/libghostty.a"
          echo "path=$PWD/$slice" >> "$GITHUB_OUTPUT"

      # Two toolchains, deliberately — the same split ci.yml makes, for the
      # same reasons. zig 0.15.2 (required by ghostty v1.3.1) cannot link
      # against the macOS 26 SDK — every libc symbol comes back undefined — so
      # ghostty must build under the image's default Xcode 16.4 and its macOS
      # 15 SDK. The app is the opposite: ChangesView.swift relies on Swift 6.2
      # actor-isolation rules that 16.4 rejects. So switch only after the
      # xcframework exists. Without this step the Release build fails with
      # actor-isolation errors in AboutPanel, ChangesView, InlineTextField and
      # PortsConfig, which is exactly what v0.2.1's first run did.
      - name: Select newest Xcode for the Swift build
        run: |
          ls -d /Applications/Xcode_*.app
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"

      - name: Log build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build Monaco editor
        run: ./scripts/build-editor.sh

      - name: Set version
        run: ./scripts/set-version.sh "${{ steps.version.outputs.version }}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build release
        # Same flags as `./scripts/dev.sh release`: ad-hoc identity ("-"), the
        # local entitlements file, and no --timestamp (a secure timestamp needs
        # a real certificate). Plus `ARCHS=arm64`: a Release build otherwise
        # takes ARCHS_STANDARD, which is arm64 + x86_64, and the x86_64 half
        # would fail to link against a `native` xcframework. And the resolved
        # slice path, because project.yml's is the universal one.
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/derived \
            -clonedSourcePackagesDirPath build/derived/SourcePackages \
            ARCHS=arm64 \
            LIBRARY_SEARCH_PATHS="${{ steps.ghostty-slice.outputs.path }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            CODE_SIGN_ENTITLEMENTS=Resources/atelier-local.entitlements \
            OTHER_CODE_SIGN_FLAGS="--options=runtime" \
            build

      - name: Package DMG
        run: |
          APP_BUILT=$(find build/derived -name "${APP_NAME}.app" -type d | head -1)
          if [ -z "$APP_BUILT" ]; then
            echo "Error: Built app not found"
            exit 1
          fi

          mkdir -p build/release
          # -R preserves the ad-hoc signatures xcodebuild already applied to the
          # app, its frameworks, and the helpers. Nothing is re-signed here:
          # without a Developer ID there is nothing better to re-sign with.
          cp -R "$APP_BUILT" "build/release/${APP_NAME}.app"
          APP="build/release/${APP_NAME}.app"

          codesign --verify --deep --strict --verbose=2 "$APP"

          DMG_NAME="${SCHEME}.dmg"
          brew install create-dmg

          DMG_STAGING="build/dmg-staging"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP" "$DMG_STAGING/"

          # create-dmg exits non-zero when skipping deprecated internet-enable
          create-dmg \
            --volname "$APP_NAME" \
            --background "Resources/dmg-background@2x.png" \
            --window-size 660 500 \
            --icon-size 128 \
            --icon "${APP_NAME}.app" 170 190 \
            --app-drop-link 490 190 \
            --no-internet-enable \
            "build/release/$DMG_NAME" \
            "$DMG_STAGING" || true

          if [ ! -f "build/release/$DMG_NAME" ]; then
            echo "Error: DMG was not created"
            exit 1
          fi

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --draft --verify-tag --generate-notes --title "$TAG_NAME"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload --clobber "$TAG_NAME" "build/release/$DMG_NAME"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to upload release assets for $TAG_NAME after $attempt attempts"
              exit 1
            fi

            sleep 10
          done

      - name: Note the unsigned build in the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Prepended rather than appended: someone who downloads the DMG and
          # gets "Atelier is damaged" needs this before the commit list, not
          # under it.
          BODY=$(gh release view "$TAG_NAME" --json body -q .body)
          NOTE=$(cat <<'MARKDOWN'
          > **Apple Silicon only.** This DMG is an arm64 build. It will not run
          > on an Intel Mac, even though the deployment target (macOS 14) is one
          > an Intel Mac can reach.
          >
          > **This build is not notarized.** It is ad-hoc signed, so macOS will
          > refuse to open it on the first try. Right-click the app in
          > `/Applications` and choose **Open**, then confirm — or run:
          >
          > ```console
          > xattr -dr com.apple.quarantine /Applications/Atelier.app
          > ```
          >
          > You only have to do this once per install. See
          > [docs/distribution.md](https://github.com/phaedryx/atelier/blob/main/docs/distribution.md).

          MARKDOWN
          )
          printf '%s\n%s' "$NOTE" "$BODY" | gh release edit "$TAG_NAME" --notes-file -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
