name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is otherwise enforced only by the prek pre-commit hook, which
  # requires each developer to have run `prek install`. That is how the tree
  # drifted far enough to need a wholesale format pass. This job makes it
  # actually enforced, and needs no submodules, Zig, or Xcode, so it fails in
  # seconds rather than after the full build.
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      # Read the version from prek.toml so the hook and CI cannot disagree
      # about which SwiftFormat is authoritative.
      - name: Resolve pinned SwiftFormat version
        id: pin
        run: |
          version=$(grep -A3 'nicklockwood/SwiftFormat' prek.toml | grep 'rev = ' | head -1 | sed -E 's/.*"(.+)".*/\1/')
          if [ -z "$version" ]; then
            echo "error: could not read the SwiftFormat pin from prek.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned SwiftFormat: $version"

      - name: Install SwiftFormat
        run: |
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${{ steps.pin.outputs.version }}/swiftformat.zip"
          unzip -q swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Check formatting
        run: swiftformat Sources Tests --lint

  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Zig
        uses: ./.github/actions/install-zig
        with:
          version: 0.15.2

      - uses: oven-sh/setup-bun@v2

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/atelier/spm
          key: spm-ci-${{ hashFiles('project.yml') }}
          restore-keys: spm-ci-

      # Keyed on the submodule's checked-out commit. Do not switch this to
      # hashFiles('ghostty/.git') — for a submodule that path is a pointer file
      # whose contents never change when the pinned commit moves.
      - name: Compute Ghostty cache key
        id: ghostty-key
        run: echo "key=ghostty-ci-$(git -C ghostty rev-parse HEAD)-zig-0.15.2-macos15" >> "$GITHUB_OUTPUT"

      # Deliberately a different key namespace from release.yml: CI builds a
      # host-arch-only xcframework, and a release must never restore it.
      - name: Cache Ghostty xcframework
        id: ghostty-cache
        uses: actions/cache@v5
        with:
          path: |
            ghostty/macos/GhosttyKit.xcframework
            ghostty/zig-out
          key: ${{ steps.ghostty-key.outputs.key }}

      - name: Build Ghostty xcframework
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          cd ghostty
          zig build -Demit-xcframework=true -Demit-macos-app=false -Doptimize=ReleaseFast

      - name: Verify Ghostty artifacts
        run: |
          test -d ghostty/macos/GhosttyKit.xcframework
          test -d ghostty/zig-out/share/terminfo
          test -d ghostty/zig-out/share/ghostty

      # Two toolchains, deliberately. zig 0.15.2 (required by ghostty v1.3.1)
      # cannot link against the macOS 26 SDK — every libc symbol comes back
      # undefined — so ghostty must build under the image's default Xcode 16.4
      # and its macOS 15 SDK. The app is the opposite: ChangesView.swift relies
      # on Swift 6.2 actor-isolation rules that 16.4 rejects. So switch only
      # after the xcframework exists.
      - name: Select newest Xcode for the Swift build
        run: |
          ls -d /Applications/Xcode_*.app
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"

      - name: Log build environment
        run: |
          xcodebuild -version
          swift --version

      # PhaseExecutorTests spawn a real process-compose. Without the binary
      # they XCTSkip, and the run still reports success — so the most
      # security-relevant end-to-end tests in the suite (bootstrap
      # environment, failure reporting, --keep-project exit codes) were
      # passing by never running here.
      - name: Install process-compose
        run: brew install f1bonacc1/tap/process-compose

      # Installing is not enough: the tests probe three absolute paths, so a
      # brew prefix change would silently return them to skipping.
      - name: Verify process-compose is where the tests look
        run: |
          test -x /opt/homebrew/bin/process-compose \
            || test -x /usr/local/bin/process-compose \
            || test -x "$HOME/.local/bin/process-compose" \
            || {
              echo "::error::process-compose is not on ProcessCompose.Settings.searchPaths — PhaseExecutorTests would skip"
              exit 1
            }
          process-compose version

      # dev.sh runs xcodegen and builds the Monaco bundle itself.
      - name: Build
        run: ./scripts/dev.sh build

      - name: Test
        run: ./scripts/dev.sh test
