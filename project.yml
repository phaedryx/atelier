name: Atelier
options:
  bundleIdPrefix: com.github.phaedryx
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_OBJC_BRIDGING_HEADER: Resources/Atelier-Bridging-Header.h
    HEADER_SEARCH_PATHS:
      - $(PROJECT_DIR)/ghostty/include
    OTHER_SWIFT_FLAGS:
      - "-Xcc"
      - "-Wno-incomplete-umbrella"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Empty by default: crash reporting stays off until a DSN is supplied.
    ATELIER_SENTRY_DSN: ""
    # Empty by default: usage telemetry stays off until a collector is supplied.
    ATELIER_TELEMETRY_ENDPOINT: ""
    ATELIER_TELEMETRY_WEBSITE_ID: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"


packages:
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark
    from: "0.8.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.15.0"

targets:
  Atelier:
    type: application
    platform: macOS
    info:
      path: Atelier/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleVersion: "0.1.79"
        CFBundleShortVersionString: "0.1.79"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        SentryDSN: $(ATELIER_SENTRY_DSN)
        TelemetryEndpoint: $(ATELIER_TELEMETRY_ENDPOINT)
        TelemetryWebsiteID: $(ATELIER_TELEMETRY_WEBSITE_ID)
        LSUIElement: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.github.phaedryx.atelier.open
            CFBundleURLSchemes:
              - $(ATELIER_URL_SCHEME)
        NSAppleEventsUsageDescription: A program running within Atelier would like to use AppleScript.
        NSAudioCaptureUsageDescription: A program running within Atelier would like to access your system's audio.
        NSBluetoothAlwaysUsageDescription: A program running within Atelier would like to use Bluetooth.
        NSCalendarsUsageDescription: A program running within Atelier would like to access your Calendar.
        NSCameraUsageDescription: A program running within Atelier would like to use the camera.
        NSContactsUsageDescription: A program running within Atelier would like to access your Contacts.
        NSLocalNetworkUsageDescription: A program running within Atelier would like to access the local network.
        NSLocationTemporaryUsageDescriptionDictionary: A program running within Atelier would like to use your location temporarily.
        NSLocationUsageDescription: A program running within Atelier would like to access your location information.
        NSMicrophoneUsageDescription: A program running within Atelier would like to use your microphone.
        NSMotionUsageDescription: A program running within Atelier would like to access motion data.
        NSPhotoLibraryUsageDescription: A program running within Atelier would like to access your Photo Library.
        NSRemindersUsageDescription: A program running within Atelier would like to access your reminders.
        NSSpeechRecognitionUsageDescription: A program running within Atelier would like to use speech recognition.
        NSSystemAdministrationUsageDescription: A program running within Atelier requires elevated privileges.
    sources:
      - path: Sources
        excludes:
          - Launcher
          - MCPHelper
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Localization/en.lproj/Localizable.strings
        buildPhase: resources
      - path: Localization/en.lproj/InfoPlist.strings
        buildPhase: resources
      - path: Resources/Scripts/atelier
        buildPhase: resources
      - path: Resources/Scripts/atelier-hook
        buildPhase: resources
      - path: Resources/Scripts/atelier-opencode.js
        buildPhase: resources
      - path: Resources/AgentSprites
        buildPhase: resources
        type: folder
      - path: Resources/notification.wav
        buildPhase: resources
      - path: ghostty/zig-out/share/terminfo
        type: folder
        buildPhase: resources
      - path: ghostty/zig-out/share/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/MonacoEditor
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_MODULE_NAME: Atelier
        CODE_SIGN_ENTITLEMENTS: Resources/atelier.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/ghostty/macos/GhosttyKit.xcframework/macos-arm64_x86_64
        OTHER_LDFLAGS:
          - -lghostty
          - -lz
          - -lc++
          - -framework Metal
          - -framework MetalKit
          - -framework CoreGraphics
          - -framework CoreText
          - -framework Foundation
          - -framework IOSurface
          - -framework QuartzCore
          - -framework AppKit
          - -framework IOKit
          - -framework Carbon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.github.phaedryx.atelier.debug
          PRODUCT_NAME: Atelier
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ATELIER_URL_SCHEME: atelier-debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.github.phaedryx.atelier
          PRODUCT_NAME: Atelier
          ATELIER_URL_SCHEME: atelier
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - target: AtelierRun
      - target: AtelierMCP
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: Sentry
        product: Sentry
    preBuildScripts:
      - script: |
          set -e
          "${PROJECT_DIR}/scripts/build-editor.sh"
        name: Build Monaco Editor
        inputFiles:
          - $(PROJECT_DIR)/editor/package.json
          - $(PROJECT_DIR)/editor/bun.lock
          - $(PROJECT_DIR)/editor/src/main.js
          - $(PROJECT_DIR)/editor/src/diff.js
          - $(PROJECT_DIR)/editor/src/shared-init.js
          - $(PROJECT_DIR)/editor/index.html
          - $(PROJECT_DIR)/editor/diff.html
          - $(PROJECT_DIR)/editor/vite.config.js
        outputFiles:
          - $(PROJECT_DIR)/Resources/MonacoEditor/index.html
          - $(PROJECT_DIR)/Resources/MonacoEditor/diff.html
    postBuildScripts:
      - script: |
          set -e
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          for helper in atelier-run atelier-mcp; do
            dest="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/${helper}"
            cp -f "${BUILT_PRODUCTS_DIR}/${helper}" "$dest"
            chmod +x "$dest"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp --options=runtime --generate-entitlement-der "$dest"
          done
        name: Bundle helpers
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/atelier-run
          - $(BUILT_PRODUCTS_DIR)/atelier-mcp
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/atelier-run
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/atelier-mcp

  AtelierRun:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        includes:
          - Launcher/**
          - Models/AppConstants.swift
          - Models/FilePersistence.swift
          - Models/RunState.swift
    settings:
      base:
        PRODUCT_NAME: atelier-run
        OTHER_LDFLAGS:
          - -lproc
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  AtelierMCP:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        includes:
          - MCPHelper/**
          - Models/AppConstants.swift
          - Models/FilePersistence.swift
          - Models/IPC/IPCProtocol.swift
    settings:
      base:
        PRODUCT_NAME: atelier-mcp
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  AtelierTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Atelier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.phaedryx.atelier.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Atelier.app/Contents/MacOS/Atelier"

schemes:
  Atelier:
    build:
      targets:
        Atelier: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtelierTests
